[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dhw-app-kit"
version = "0.1.0a5"
description = "Versioned dHW design and server-side OIDC building blocks"
requires-python = ">=3.12"
license = "GPL-3.0-only"
dependencies = [
  "authlib>=1.6.5,<2", "joserfc>=1.5,<2", "cryptography>=50,<51", "httpx>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0.44,<3", "psycopg[binary]>=3.2,<4", "starlette>=0.49,<2",
]
[dependency-groups]
dev = ["jinja2>=3.1.6,<4", "pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "pip-audit>=2.9,<3"]
[tool.hatch.build.targets.wheel]
packages = ["src/app_kit"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
