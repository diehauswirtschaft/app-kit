version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /scripts/postgres
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # CodeQL init and analyze exchange version-specific state in the same job.
    groups:
      codeql-actions:
        applies-to: version-updates
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
