name: app-kit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check src tests scripts
      - run: uv run --locked pytest -q
      - run: npm ci --ignore-scripts
      - run: node --test tests/*.test.mjs
      - run: npm audit --omit=dev
      - run: uv build
      - name: Cold import from the wheel without database dependencies
        run: |
          uv venv --python 3.13 "$RUNNER_TEMP/base-wheel"
          python="$RUNNER_TEMP/base-wheel/bin/python"
          uv pip install --python "$python" dist/*.whl
          "$python" -I -c 'from importlib.util import find_spec; from app_kit.auth import OIDC; assert all(find_spec(name) is None for name in ("sqlalchemy", "psycopg", "greenlet"))'
      - run: uv run --locked --extra postgres python scripts/test_postgres.py -q
      - name: Audit locked runtime dependencies (including the optional PostgreSQL adapter)
        run: |
          uv export --locked --extra postgres --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/runtime-requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/runtime-requirements.txt" --disable-pip --no-deps
