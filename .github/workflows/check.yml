name: app-kit checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
      - run: uv sync --locked --python 3.13
      - run: uv run ruff check src tests scripts
      - run: uv run python scripts/test_postgres.py -q
      - run: node --test tests/navigation.test.mjs
      - run: uv build
      - name: Audit locked runtime dependencies
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/runtime-requirements.txt"
          uv run pip-audit -r "$RUNNER_TEMP/runtime-requirements.txt" --disable-pip --no-deps
