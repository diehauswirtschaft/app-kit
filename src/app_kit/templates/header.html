{# Identity comes only from this app's server session, never portal cookies.
   Brand stays non-interactive like the previous kit: no new reload target that
   could discard an active recording or an unsaved draft (AP-02). #}
<header class="dhw-header">
  <div class="dhw-header-inner">
    <div class="dhw-brand">
      <picture class="dhw-brand-logo">
        <source media="(prefers-color-scheme: dark)" srcset="/assets/app-kit/logo-dark.svg">
        <img src="/assets/app-kit/logo.svg" alt="die HausWirtschaft" width="1538" height="185">
      </picture>
      <span class="dhw-app-name">{{ app_title }}</span>
    </div>
    <nav aria-label="App-Navigation">
      <a href="https://start.dhw.wien">dHW Start</a>
      <a href="/">Übersicht</a>
      {% if user %}
        <span class="dhw-header-user">{{ user.name }}</span>
        <form action="/auth/logout" method="post">
          <input type="hidden" name="_csrf" value="{{ csrf }}">
          <button type="submit">Hier abmelden</button>
        </form>
      {% endif %}
    </nav>
  </div>
</header>
